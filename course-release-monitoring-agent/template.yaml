AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS Course Release Monitoring Agent - monitors releases.awstc.com and sends Bedrock-formatted release notifications via SNS.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  NotificationEmail:
    Type: String
    Default: "kenkrueger65@gmail.com"
    Description: Email address to receive release alert notifications.

  ScheduleExpression:
    Type: String
    Default: "cron(0 20 * * ? *)"
    Description: EventBridge schedule expression (default daily at 8:00 PM UTC).

  LookbackDays:
    Type: Number
    Default: 7
    Description: >
      Size of the recency window, in days. Courses whose latest release date is
      older than this many days before the current run are filtered out (in
      code) before anything is sent to the model.

  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-6"
    Description: >
      Amazon Bedrock model ID used for both model calls. A capable model is
      recommended: the version-classification step benefits from reliable
      reasoning. Smaller models (e.g. Nova Lite) proved unreliable at excluding
      patch-only releases. A deterministic code-side filter now enforces
      major/minor-only regardless of model, but a strong model still gives the
      cleanest results.

  NotifyChangesOnly:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      When "true" (default), an email is only sent when course changes are
      detected. When "false", an email is sent on every run — useful for
      verifying the end-to-end pipeline is working even when nothing has changed.

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 180
    Environment:
      Variables:
        SNS_TOPIC_ARN: !Ref CourseReleaseAlertTopic
        LOOKBACK_DAYS: !Ref LookbackDays
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        NOTIFY_CHANGES_ONLY: !Ref NotifyChangesOnly

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── SNS Topic ────────────────────────────────────────────────────────────
  CourseReleaseAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-course-release-alerts"
      DisplayName: "AWS Course Release Alerts"

  CourseReleaseEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CourseReleaseAlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ── Lambda Function ───────────────────────────────────────────────────────
  CourseReleaseMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-monitor"
      Handler: src/handler.lambda_handler
      Description: Monitors AWS Training & Certification releases and sends formatted diff emails.
      Policies:
        # Allow publishing to the alert SNS topic
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CourseReleaseAlertTopic.TopicName
        # Bedrock InvokeModel + Converse – covers foundation models AND
        # cross-region inference profiles (e.g. us.amazon.nova-*-v1:0)
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:aws:bedrock:*::foundation-model/*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Name: !Sub "${AWS::StackName}-daily-trigger"
            Description: "Triggers the monitoring Lambda daily"
            Schedule: !Ref ScheduleExpression
            Enabled: true

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  LambdaFunctionArn:
    Description: ARN of the monitoring Lambda function
    Value: !GetAtt CourseReleaseMonitorFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS alert topic
    Value: !Ref CourseReleaseAlertTopic

  SNSTopicName:
    Description: Name of the SNS alert topic
    Value: !GetAtt CourseReleaseAlertTopic.TopicName
